# Default values for the multimodal-rag chart. CI overrides image.*.repository
# and image.*.tag via --set at deploy time (see .github/workflows/ci-cd.yml).

image:
  api:
    repository: ""   # set via --set image.api.repository=<ECR_API_REPO>
    tag: "latest"
  ui:
    repository: ""   # set via --set image.ui.repository=<ECR_UI_REPO>
    tag: "latest"
  pullPolicy: IfNotPresent

# Node group is 2x t3.medium (4 vCPU / 4GiB RAM total). Requests are sized so
# 2 api + 2 ui replicas fit comfortably on 2 nodes with headroom for
# kube-system/addons (cluster-autoscaler, metrics-server, vpa, goldilocks);
# limits leave room for HPA to scale up before the autoscaler adds a 3rd node.
# Steady state (2 api + 2 ui) requests 3.50 GiB of the 5.44 GiB available on
# 2 nodes; worst case at max scale requests 8.00 GiB, which needs the 3rd node
# and fits inside its 8.66 GiB ceiling.
api:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    # 6 was unschedulable: 6Gi api + 3Gi ui + ~1Gi system exceeds the 9.66 GiB
    # three-node ceiling. 5 is the largest count that still fits.
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ui:
  replicaCount: 1
  port: 8501
  # Streamlit keeps the uploaded document's index in per-pod, in-memory session
  # state, so a request served by any pod other than the one that received the
  # upload silently answers from the sample PDF instead.
  #
  # sessionAffinity: ClientIP was the first attempt at pinning a client to one
  # pod. It does not work here. The in-tree AWS provider rejects it on a classic
  # ELB and the Service reconcile loop fails with "unsupported load balancer
  # affinity: ClientIP", while `kubectl describe svc` still reports the field as
  # set. The setting is accepted by the API server and then quietly discarded by
  # the cloud provider, so it verified as applied while doing nothing at all.
  #
  # Until ingest moves off the request path (see docs/OBSERVABILITY_BUILD_PLAN.md
  # for the Kafka worker plan) the only reliable fix is to have exactly one UI
  # pod, so every request necessarily reaches the pod holding the session. That
  # is why autoscaling is disabled below rather than merely bounded: an HPA
  # scale-down deletes a pod, and if that pod holds the uploaded index the user's
  # document disappears mid-session. Observed live: the HPA scaled 2 -> 3 during
  # a 13.5 MB ingest and back to 2 eighty seconds later, destroying the upload.
  sessionAffinity: None
  # The UI pod runs ingest in-process, so it carries a ~527 MB Python import
  # baseline plus ~248 MB transient per concurrent upload. A 512Mi request sat
  # below that baseline, so the HPA read 81% of its 80% memory target at idle
  # and pods were OOMKilled with no traffic at all. The request now sits above
  # the baseline and the limit absorbs the baseline plus two concurrent uploads
  # (527 + 2*248 = ~1023 MB) with headroom.
  #
  # 1536Mi was then OOMKilled (exit 137) by a 13.5 MB CAD tutorial: that sizing
  # assumed a text-heavy paper, but an image-heavy PDF rasterizes hundreds of
  # page images for CLIP. The limit now covers one such document. The request is
  # deliberately unchanged, because the request is what the HPA measures against
  # and what the scheduler packs on, and raising it would cost 4 nodes of
  # headroom to protect against a case the MAX_UPLOAD_MB guard already bounds.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 2560Mi
  # Disabled deliberately, not left unconfigured. See the sessionAffinity note
  # above: the UI is stateful per pod, so horizontal scaling actively destroys
  # user sessions rather than serving more of them. The API tier is stateless
  # and keeps its HPA, so load still scales where scaling is safe. Re-enable
  # this only once ingest state lives outside the pod.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /_stcore/health
      port: 8501
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /_stcore/health
      port: 8501
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Non-secret config, mounted as env vars via a ConfigMap. Mirrors
# ansible/templates/env.j2's defaults for parity across deploy targets.
config:
  TEXT_ENCODER_BACKEND: "minilm"
  OPENAI_TEXT_EMBED_MODEL: "text-embedding-3-small"
  MINILM_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  CLIP_MODEL: "openai/clip-vit-base-patch32"
  VISION_MODEL: "gpt-4o-mini"
  GATEWAY_FALLBACKS: "gpt-4o,groq/openai/gpt-oss-120b"
  GATEWAY_CACHE: "true"
  GATEWAY_TIMEOUT_SEC: "60"
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_MODEL: "gpt-4o-mini"
  # Production posture: block instead of degrading to an unguarded answer
  # when guardrails can't run (differs from the code default of "false").
  GUARDRAILS_FAIL_CLOSED: "true"
  TEXT_CHUNK_SIZE: "500"
  TEXT_CHUNK_OVERLAP: "100"
  TOP_K_TEXT: "4"
  TOP_K_IMAGE: "3"
  EVAL_JUDGE_MODEL: "gpt-4o-mini"
  EVAL_THRESHOLD: "0.7"
  VERIFY_ANSWERS: "false"
  VERIFY_MAX_RETRIES: "1"
  # Upload ceiling for the in-process ingest path. Sized against the UI memory
  # limit above: past this, rasterizing the pages OOMKills the pod rather than
  # failing the one request.
  MAX_UPLOAD_MB: "25"

# Secret values. CI supplies these via --set-string secrets.* from GitHub
# Actions secrets - never committed here. Leave blank for local `helm template`.
secrets:
  openaiApiKey: ""
  groqApiKey: ""

podDisruptionBudget:
  enabled: true
  # Applies to the API tier, which runs 2+ stateless replicas.
  minAvailable: 1
  # The UI tier is a single stateful replica, so it needs maxUnavailable rather
  # than minAvailable, or nothing could ever drain the node it sits on.
  uiMaxUnavailable: 1

serviceAccount:
  create: false
  name: ""
