# Default values for the multimodal-rag chart. CI overrides image.*.repository
# and image.*.tag via --set at deploy time (see .github/workflows/ci-cd.yml).

image:
  api:
    repository: ""   # set via --set image.api.repository=<ECR_API_REPO>
    tag: "latest"
  ui:
    repository: ""   # set via --set image.ui.repository=<ECR_UI_REPO>
    tag: "latest"
  pullPolicy: IfNotPresent

# Node group is 2x t3.medium (4 vCPU / 4GiB RAM total). Requests are sized so
# 2 api + 2 ui replicas fit comfortably on 2 nodes with headroom for
# kube-system/addons (cluster-autoscaler, metrics-server, vpa, goldilocks);
# limits leave room for HPA to scale up before the autoscaler adds a 3rd node.
api:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

ui:
  replicaCount: 2
  port: 8501
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    httpGet:
      path: /_stcore/health
      port: 8501
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /_stcore/health
      port: 8501
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Non-secret config, mounted as env vars via a ConfigMap. Mirrors
# ansible/templates/env.j2's defaults for parity across deploy targets.
config:
  TEXT_ENCODER_BACKEND: "minilm"
  OPENAI_TEXT_EMBED_MODEL: "text-embedding-3-small"
  MINILM_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  CLIP_MODEL: "openai/clip-vit-base-patch32"
  VISION_MODEL: "gpt-4o-mini"
  GATEWAY_FALLBACKS: "gpt-4o,groq/llama-3.3-70b-versatile"
  GATEWAY_CACHE: "true"
  GATEWAY_TIMEOUT_SEC: "60"
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_MODEL: "gpt-4o-mini"
  # Production posture: block instead of degrading to an unguarded answer
  # when guardrails can't run (differs from the code default of "false").
  GUARDRAILS_FAIL_CLOSED: "true"
  TEXT_CHUNK_SIZE: "500"
  TEXT_CHUNK_OVERLAP: "100"
  TOP_K_TEXT: "4"
  TOP_K_IMAGE: "3"
  EVAL_JUDGE_MODEL: "gpt-4o-mini"
  EVAL_THRESHOLD: "0.7"
  VERIFY_ANSWERS: "false"
  VERIFY_MAX_RETRIES: "1"

# Secret values. CI supplies these via --set-string secrets.* from GitHub
# Actions secrets - never committed here. Leave blank for local `helm template`.
secrets:
  openaiApiKey: ""
  groqApiKey: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: false
  name: ""
